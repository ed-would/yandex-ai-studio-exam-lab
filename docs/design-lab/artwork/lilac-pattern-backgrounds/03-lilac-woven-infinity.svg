<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1328" viewBox="0 0 2400 1328">
  <title>Переплетение бесконечности</title><desc>64 petals follow a Bernoulli lemniscate x = 565 cos(t)/(1+sin²(t)), y = 775 sin(t)cos(t)/(1+sin²(t)). Petals align to the tangent with consistent handedness around both loops. Radius is 250 + 100 cos²(t). The second crossing passes in front. All shapes are closed cubic Bézier paths. No random placements or deformations are used.</desc>
  <defs><path id="petal" d="M 0 0 C 0.28 -0.09 0.57 -0.82 0.98 -0.67 C 1.30 -0.53 1.03 -0.09 0.67 0.04 C 0.39 0.15 0.14 0.06 0 0 Z"/>
  <linearGradient id="petal-light" gradientUnits="userSpaceOnUse" x1="0.51" y1="0.13" x2="0.46" y2="-0.69">
    <stop offset="0" stop-color="#f4efb3"/>
    <stop offset="0.24" stop-color="#eee9a8"/>
    <stop offset="0.44" stop-color="#f0dfba"/>
    <stop offset="0.64" stop-color="#e9c0f7"/>
    <stop offset="0.83" stop-color="#c68cf6"/>
    <stop offset="0.94" stop-color="#a96ade"/>
    <stop offset="1" stop-color="#9660cf"/>
  </linearGradient>
  <radialGradient id="mint-tip" gradientUnits="userSpaceOnUse" cx="0.98" cy="-0.66" r="0.19">
    <stop offset="0" stop-color="#a6c98d" stop-opacity="0.88"/>
    <stop offset="0.40" stop-color="#b2cf99" stop-opacity="0.58"/>
    <stop offset="1" stop-color="#b2cf99" stop-opacity="0"/>
  </radialGradient></defs><rect width="2400" height="1328" fill="#f2dff7"/>
