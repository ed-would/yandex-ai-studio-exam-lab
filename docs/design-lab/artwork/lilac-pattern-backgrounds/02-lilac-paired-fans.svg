<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1328" viewBox="0 0 2400 1328">
  <title>Парные веера</title><desc>Two mirrored petal fans share the focus (1940, 880). Each has 20 blades. Radius is 1100 × 0.915^n, angle advances 8° per blade, and the second fan has a fixed 4.5° phase offset. All shapes are closed cubic Bézier paths. No random placements or deformations are used.</desc>
