<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Тренажёр компетенций ИИ. Подготовка к экзамену «Основы работы с ИИ» на платформе Yandex AI Studio.">
    <link rel="icon" href="../../../../public/images/brand/trainer-abstract-256-optimized.webp" type="image/webp">
    <title>Social preview · Тренажёр компетенций ИИ</title>
    <style>
      @font-face {
        font-family: Unbounded;
        src: url('../../../../public/fonts/unbounded-cyrillic-variable.woff2') format('woff2');
        font-weight: 200 900;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: Unbounded;
        src: url('../../../../public/fonts/unbounded-latin-variable.woff2') format('woff2');
        font-weight: 200 900;
        unicode-range: U+0000-00FF, U+2000-206F, U+2191, U+2193, U+2212, U+2215;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #17151d; }
      body { min-height: 100vh; display: grid; place-items: center; }
      .poster {
        position: relative;
        isolation: isolate;
        container-type: inline-size;
        width: 100vw;
        aspect-ratio: 2 / 1;
        overflow: hidden;
        color: #f4eeff;
        background: #17151d;
      }
      .artwork { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
      .floor {
        clip-path: polygon(0 76.72%, 100% 83.74%, 100% 100%, 0 100%);
        transform: translateY(.5637cqw);
      }
      .trainer-mark {
        position: absolute;
        left: 4.22%;
        top: calc(8.1% - .0275cqw);
        width: 5.94cqw;
        height: 5.94cqw;
        object-fit: contain;
      }
      h1 { margin: 0; color: #c5a8f2; font-family: Unbounded, Arial, sans-serif; font-weight: 500; letter-spacing: -.09cqw; }
      h1 span { display: block; position: absolute; white-space: nowrap; line-height: 1.1; }
      .title-first { top: 8.1%; left: 11.7%; font-size: 5.35cqw; }
      .title-second { top: 22.8%; left: 4.22%; font-size: 4.994531cqw; }
      .title-third { top: 33.8%; left: 4.22%; font-size: 9.3cqw; }
      .exam-copy {
        position: absolute;
        top: 78.25%;
        bottom: 0;
        left: 4.22%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: .46875cqw;
      }
      .exam-label {
        margin: 0;
        color: #d3e38c;
        font: 400 2.22cqw/1.3 Arial, 'Helvetica Neue', sans-serif;
      }
      .exam-title {
        margin: 0;
        color: #f4eeff;
        font: 450 3.18cqw/1.2 Unbounded, Arial, sans-serif;
        letter-spacing: -.035em;
        white-space: nowrap;
      }
      .platform {
        position: absolute;
        right: 4.22%;
        bottom: 3.8721%;
        display: flex;
        align-items: baseline;
        gap: 1.55cqw;
      }
      .platform span { font: 400 2.03cqw/1.3 Arial, 'Helvetica Neue', sans-serif; white-space: nowrap; }
      .platform img {
        display: block;
        width: 20.4cqw;
        height: auto;
        transform: translateY(.439747cqw);
      }
    </style>
  </head>
  <body>
    <main class="poster" aria-label="Тренажёр компетенций ИИ. Подготовка к экзамену «Основы работы с ИИ» на платформе Yandex AI Studio.">
      <img class="artwork" src="artwork-generated.png" alt="">
      <img class="artwork floor" src="floor-reference.png" alt="">
      <img class="trainer-mark" src="../../../../public/images/brand/trainer-abstract-256-optimized.webp" alt="">
      <h1><span class="title-first">Тренажёр</span><span class="title-second">компетенций</span><span class="title-third">ИИ</span></h1>
      <div class="exam-copy">
        <p class="exam-label">Подготовка к экзамену</p>
        <p class="exam-title">«Основы работы с ИИ»</p>
      </div>
      <div class="platform">
        <span>на платформе</span>
        <img src="../../../../public/images/brand/ai-studio-white.svg" alt="Yandex AI Studio" width="347" height="58">
      </div>
    </main>
  </body>
</html>
