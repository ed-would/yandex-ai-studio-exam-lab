<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hero v5 mobile dark: тёмная тема, desktop</title>
  <style>
    @font-face{font-family:Unbounded;src:url('../../../public/fonts/unbounded-cyrillic-variable.woff2') format('woff2');font-weight:200 900;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
    @font-face{font-family:Unbounded;src:url('../../../public/fonts/unbounded-latin-variable.woff2') format('woff2');font-weight:200 900;unicode-range:U+0000-00FF,U+2000-206F,U+2191,U+2193,U+2212,U+2215}
    *{box-sizing:border-box}
    body{margin:0;background:#24212d;color:#f2edf8;font-family:Arial,sans-serif}
    .board{position:relative;width:900px;height:1300px;overflow:hidden}
    .artwork{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .copy{position:absolute;left:64px;top:76px;width:772px}
    .kicker{font-family:Unbounded,Arial,sans-serif;font-size:40px;font-weight:450;line-height:1.3;letter-spacing:-.02em;color:#f2edf8;margin:0 0 72px 78px;white-space:nowrap}
    h1{font-family:Unbounded,Arial,sans-serif;font-size:94px;font-weight:450;line-height:1.1;letter-spacing:-.035em;margin:0 0 50px}
    h1 span{display:block;white-space:nowrap}
    .promise{font-size:40px;line-height:1.4;margin:0}
    .promise span{display:block;white-space:nowrap}
    .facts{position:absolute;left:64px;top:1174px;display:flex;align-items:center;gap:18px;margin:0;padding:0;list-style:none}
    .pill{padding:15px 22px;border-radius:999px;font-size:34px;font-weight:700;line-height:1.1;white-space:nowrap}
    .pill.lime{background:#343c27;color:#d3e38c}
    .pill.teal{background:#273f40;color:#93d7d0}
    .pill.lilac{background:#3b304d;color:#c5a8f2}
    .board.no-letters .kicker,.board.no-letters h1,.board.no-letters .promise,.board.no-letters .pill span{visibility:hidden}
  </style>
</head>
<body>
  <main id="capture" class="board" aria-label="Тренажёр компетенций ИИ: основы работы с ИИ, 180 вопросов, 3 уровня, 6 доменов">
    <img class="artwork" src="artwork-mobile-dark.png" alt="Небольшой пятилистный логотип отдельно слева. Справа на одном переднем плане, с равным визуальным весом: лаймовый складчатый тор, бирюзовые арки со сферой и сиреневая треугольная лента – формы трёх уровней тренажёра">
    <div class="copy">
      <p class="kicker">Тренажёр компетенций ИИ</p>
      <h1><span>Основы</span><span>работы с ИИ</span></h1>
      <p class="promise"><span>Практика перед экзаменом.</span><span>Разбор после каждого ответа.</span></p>
      </div>
      <ul class="facts" aria-label="Структура банка вопросов">
        <li class="pill lime"><span>180 вопросов</span></li>
        <li class="pill teal"><span>3 уровня</span></li>
        <li class="pill lilac"><span>6 доменов</span></li>
      </ul>
  </main>
</body>
</html>
