<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Банк вопросов v6: тёмная тема, desktop</title>
  <style>
    :root{--canvas:#24212d;--ink:#f2edf8;--lime:#d3e38c;--lime-soft:#343c27;--teal:#93d7d0;--teal-soft:#273f40;--lilac:#c5a8f2;--lilac-soft:#3b304d}
    @font-face{font-family:Unbounded;src:url('../../../public/fonts/unbounded-cyrillic-variable.woff2') format('woff2');font-weight:200 900;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
    @font-face{font-family:Unbounded;src:url('../../../public/fonts/unbounded-latin-variable.woff2') format('woff2');font-weight:200 900;unicode-range:U+0000-00FF,U+2000-206F,U+2191,U+2193,U+2212,U+2215}
    *{box-sizing:border-box}
    body{margin:0;background:var(--canvas);color:var(--ink);font-family:Arial,sans-serif}
    .board{position:relative;width:1600px;height:900px;overflow:hidden}
    .artwork{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .intro{position:absolute;left:80px;right:80px;top:59px;text-align:center}
    h1,h2,.equation{font-family:Unbounded,Arial,sans-serif;font-weight:450;letter-spacing:-.035em}
    h1{font-size:66px;line-height:1.2;margin:0;white-space:nowrap}
    .subtitle{font-size:30px;line-height:1.45;margin:18px 0 0;white-space:nowrap}
    .level{position:absolute;top:236px;width:424px;text-align:center}
    .level.lime{left:136px;color:var(--lime)}
    .level.teal{left:583px;color:var(--teal)}
    .level.lilac{left:1088px;color:var(--lilac)}
    h2{font-size:32px;line-height:1.25;margin:0 0 17px;white-space:nowrap}
    .count{display:inline-block;border-radius:999px;padding:12px 24px;font-size:26px;font-weight:700;line-height:1.2;margin:0}
    .lime .count{background:var(--lime-soft)}
    .teal .count{background:var(--teal-soft)}
    .lilac .count{background:var(--lilac-soft)}
    .coverage{position:absolute;left:80px;right:80px;top:746px;text-align:center}
    .coverage-card{display:inline-flex;flex-direction:column;align-items:center;background:var(--lilac-soft);border-radius:24px;padding:18px 32px}
    .equation{display:inline-flex;align-items:center;gap:24px;color:var(--lilac);font-size:36px;line-height:1.25;margin:0;white-space:nowrap}
    .scope{font-size:27px;line-height:1.25;margin:10px 0 0;color:var(--lilac);white-space:nowrap}
    .board.no-letters .ink{visibility:hidden}
  </style>
</head>
<body>
  <main id="capture" class="board" aria-label="180 авторских вопросов. Три теста: Базовый, Продвинутый, Экспертный. В каждом 60 вопросов, по 10 на каждый из шести доменов.">
    <img class="artwork" src="artwork-desktop-dark.png" alt="На одном общем отражающем полу слева лаймовый складчатый тор, в центре бирюзовые двойные арки со сферой, справа сиреневая треугольная лента. Каждая форма изображена один раз.">
    <header class="intro">
      <h1><span class="ink">180 авторских вопросов</span></h1>
      <p class="subtitle"><span class="ink">Три теста по 60 вопросов</span></p>
    </header>
    <section class="level lime" aria-label="Базовый тест">
      <h2><span class="ink">Базовый</span></h2>
      <p class="count"><span class="ink">60 вопросов</span></p>
    </section>
    <section class="level teal" aria-label="Продвинутый тест">
      <h2><span class="ink">Продвинутый</span></h2>
      <p class="count"><span class="ink">60 вопросов</span></p>
    </section>
    <section class="level lilac" aria-label="Экспертный тест">
      <h2><span class="ink">Экспертный</span></h2>
      <p class="count"><span class="ink">60 вопросов</span></p>
    </section>
    <footer class="coverage" aria-label="На каждом уровне шесть доменов по десять вопросов">
      <div class="coverage-card">
      <p class="equation"><span class="ink">6 доменов</span><span class="ink" aria-hidden="true">×</span><span class="ink">10 вопросов</span></p>
      <p class="scope"><span class="ink">на каждом уровне</span></p>
      </div>
    </footer>
  </main>
</body>
</html>
