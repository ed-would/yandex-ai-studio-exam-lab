<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Форматы заданий: light</title><style>:root{--canvas:#eee8f3;--ink:#25212b;--accent:#6841ab;--soft:#e9dcfb}
