<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учебный цикл: светлая тема</title><style>
@font-face{font-family:Unbounded;src:url('../../../public/fonts/unbounded-cyrillic-variable.woff2') format('woff2');font-weight:200 900;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Unbounded;src:url('../../../public/fonts/unbounded-latin-variable.woff2') format('woff2');font-weight:200 900;unicode-range:U+0000-00FF,U+2000-206F,U+2191,U+2193,U+2212,U+2215}
:root{--canvas:#f0edf4;--ink:#25212b;--accent:#6841ab;--soft:#e9dcfb}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Arial,sans-serif}.board{position:relative;width:1600px;height:1000px;overflow:hidden}.artwork{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.intro{position:absolute;left:80px;right:80px;top:58px}h1,h2,.number{font-family:Unbounded,Arial,sans-serif;font-weight:450;letter-spacing:-.035em}h1{font-size:62px;line-height:1.2;margin:0;white-space:nowrap}.steps{margin:0;padding:0;list-style:none}.step{position:absolute;width:300px}.step.one{left:80px;top:260px}.step.two{left:840px;top:260px;width:280px}.step.three{left:820px;top:650px;width:200px}.step.four{left:80px;top:650px;width:272px}.number{display:inline-grid;place-items:center;width:52px;height:36px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:22px;line-height:1;letter-spacing:0}h2{font-size:38px;line-height:1.2;margin:16px 0;color:var(--accent);white-space:nowrap}.description{font-size:28px;line-height:1.4;margin:0}.description .ink{display:block;white-space:nowrap}.board.no-letters .ink{visibility:hidden}
</style></head><body><main id="capture" class="board" aria-label="Учебный цикл: редактируемый черновик, фиксация и оценка ответа, разбор с памяткой и источниками, новая попытка по ошибкам и пропускам после завершения теста">
<img class="artwork" src="artwork-desktop-light.png" alt="Четыре объёмные сцены соединены по кругу: выбор варианта на карточке, печать проверки с замком, раскрытый разбор с лупой и новый набор карточек со стрелкой повтора">
<header class="intro"><h1><span class="ink">От ответа к следующей попытке</span></h1></header>
<ol class="steps" aria-label="Четыре шага практики">
<li class="step one"><span class="number" aria-hidden="true"><span class="ink">01</span></span><h2><span class="ink">Выбор</span></h2><p class="description"><span class="ink">Черновик можно</span><span class="ink">менять.</span></p></li>
<li class="step two"><span class="number" aria-hidden="true"><span class="ink">02</span></span><h2><span class="ink">Проверка</span></h2><p class="description"><span class="ink">Ответ фиксируется.</span><span class="ink">Появляются баллы.</span></p></li>
<li class="step three"><span class="number" aria-hidden="true"><span class="ink">03</span></span><h2><span class="ink">Разбор</span></h2><p class="description"><span class="ink">Объяснения,</span><span class="ink">памятка,</span><span class="ink">источники.</span></p></li>
<li class="step four"><span class="number" aria-hidden="true"><span class="ink">04</span></span><h2><span class="ink">Повтор</span></h2><p class="description"><span class="ink">После теста:</span><span class="ink">ошибки и пропуски</span><span class="ink">в новой попытке.</span></p></li>
</ol></main></body></html>
