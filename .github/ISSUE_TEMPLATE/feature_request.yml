name: Предложение
description: Идея улучшения тренажёра или документации.
title: '[Feature]: '
body:
  - type: textarea
    id: need
    attributes:
      label: Какую задачу нужно решить
      description: Опишите ситуацию пользователя и текущую трудность.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое поведение
      description: Что изменится для пользователя? Если есть, укажите альтернативы.
    validations:
      required: true
